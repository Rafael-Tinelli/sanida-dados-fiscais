name: Phase 4 CP6 README Sync

on:
  push:
    branches:
      - refactor/sources-sensors-v1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/sources-sensors-v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync README
        run: python scripts/_sync_readme_phase4_financial.py
      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: registrar migração financeira na Fase 4"
          git push origin refactor/sources-sensors-v1
