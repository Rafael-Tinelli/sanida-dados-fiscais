name: H25 V2 Post-Deploy Validation

on:
  push:
    branches:
      - deploy/h25-v2-preflight-run

permissions:
  contents: read
  actions: read

concurrency:
  group: h25-v2-postdeploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: "2222"
      SITE_ROOT: /home1/sanid210/public_html
      PLUGIN_ROOT: /home1/sanid210/public_html/blog/wp-content/plugins/sanida-fiscais-auto
      EXPECTED_BUNDLE_SHA: 4ca95de84822fc3bc70ee59c86e73e540e38bec9e6ce5951266ce62a7f8e6627
      EXPECTED_PREFLIGHT_SHA: 3debda4e9c18cc5bde643d1a93b9960a594586bbd5b27f8f42838b862600b248
      EXPECTED_RELEASE: fiscal-v1-sha256-a741aa7873950d029a5c6b1c929727267125424013f09c69137b7e80b294153e
      PREFLIGHT_RUN_ID: "35215782976"
      PREFLIGHT_ARTIFACT: h25-v2-hostgator-preflight-20734ebbedee2681af2a111381759772500f45ed

    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install local dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Rebuild and validate exact v2 bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/h25-v2-post-bundle
          python scripts/build_phase7_c71_bundle_v2.py --output-dir /tmp/h25-v2-post-bundle
          test "$(sha256sum /tmp/h25-v2-post-bundle/bundle-manifest.json | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          python scripts/validate_phase7_c71_v2_gate.py

      - name: Download exact preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREFLIGHT_ARTIFACT }}
          path: /tmp/h25-v2-preflight-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PREFLIGHT_RUN_ID }}

      - name: Verify stored preflight evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=/tmp/h25-v2-preflight-artifact/h25-v2-preflight.json
          test "$(sha256sum "$EVIDENCE" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_SHA"
          python scripts/validate_phase7_v2_remote_evidence.py \
            --evidence "$EVIDENCE" \
            --bundle-manifest /tmp/h25-v2-post-bundle/bundle-manifest.json

      - name: Configure pinned SSH client
        shell: bash
        env:
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Validate production hashes dependencies PHP and HTTP
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
          )
          SCP_OPTS=(
            -P "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
          )
          STAGE="h25-v2-postdeploy/$GITHUB_SHA"
          EVIDENCE=/tmp/h25-v2-preflight-artifact/h25-v2-preflight.json
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p \"\$HOME/$STAGE\""
          scp "${SCP_OPTS[@]}" /tmp/h25-v2-post-bundle/bundle-manifest.json "$USER@$HOST:$STAGE/bundle-manifest.json"
          scp "${SCP_OPTS[@]}" "$EVIDENCE" "$USER@$HOST:$STAGE/preflight.json"

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" python3.9 - "$SITE_ROOT" "$PLUGIN_ROOT" "$EXPECTED_BUNDLE_SHA" "$EXPECTED_PREFLIGHT_SHA" "$EXPECTED_RELEASE" "$STAGE" <<'PYREMOTE' | tee /tmp/h25-v2-postdeploy.log
          from __future__ import annotations
          from hashlib import sha256
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          import json, os, sys

          site_root = Path(sys.argv[1]).resolve()
          plugin_root = Path(sys.argv[2]).resolve()
          expected_bundle_sha = sys.argv[3]
          expected_preflight_sha = sys.argv[4]
          expected_release = sys.argv[5]
          stage_rel = sys.argv[6]
          stage = Path.home() / stage_rel
          manifest_path = stage / 'bundle-manifest.json'
          evidence_path = stage / 'preflight.json'
          roots = {'site_root': site_root, 'wordpress_plugin_dir': plugin_root}

          def digest(path: Path) -> str:
              h = sha256()
              with path.open('rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          assert digest(manifest_path) == expected_bundle_sha
          assert digest(evidence_path) == expected_preflight_sha
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          assert manifest['inventory_version'] == 2
          assert len(manifest['files']) == 33
          assert len(manifest['preexisting_dependencies']) == 11

          managed = []
          for rec in manifest['files']:
              target = roots[rec['target_root']] / rec['target_path']
              assert target.is_file(), str(target)
              observed = digest(target)
              assert observed == rec['sha256'], (str(target), observed, rec['sha256'])
              managed.append({'target_root': rec['target_root'], 'target_path': rec['target_path'], 'sha256': observed})

          dep_index = {(d['target_root'], d['relative_path']): d for d in evidence['dependencies']}
          dependencies = []
          for rec in manifest['preexisting_dependencies']:
              key = (rec['target_root'], rec['path'])
              prior = dep_index[key]
              target = roots[rec['target_root']] / rec['path']
              assert target.is_file(), str(target)
              observed = digest(target)
              assert observed == prior['sha256'], (str(target), observed, prior['sha256'])
              dependencies.append({'target_root': rec['target_root'], 'path': rec['path'], 'sha256': observed})

          php = os.popen('command -v php').read().strip()
          assert php
          php_checked = 0
          import subprocess
          for rec in manifest['files']:
              if not rec['target_path'].endswith('.php'):
                  continue
              target = roots[rec['target_root']] / rec['target_path']
              proc = subprocess.run([php, '-l', str(target)], capture_output=True, text=True)
              assert proc.returncode == 0, proc.stdout + proc.stderr
              php_checked += 1

          def fetch(url: str):
              req = Request(url, headers={'User-Agent': 'Sanida-V2-PostDeploy/1.0'})
              try:
                  with urlopen(req, timeout=20) as resp:
                      return int(resp.status), resp.read(), dict(resp.headers.items())
              except HTTPError as exc:
                  return int(exc.code), exc.read(), dict(exc.headers.items())

          base = 'https://sanida.com.br'
          urls = {
              'H25': '/financas/calculadoras/',
              'H26': '/financas/calculadoras/salario-liquido-clt/',
              'H27': '/financas/calculadoras/decimo-terceiro/',
              'H28': '/financas/calculadoras/ferias-clt/',
              'H29': '/financas/calculadoras/rescisao-clt/',
          }
          http = {}
          bodies = {}
          for name, path in urls.items():
              status, body, _ = fetch(base + path)
              assert status == 200, (name, status)
              text = body.decode('utf-8', errors='replace')
              assert 'Fatal error' not in text and 'Parse error' not in text
              http[name] = {'status': status, 'bytes': len(body)}
              bodies[name] = text

          h25 = bodies['H25']
          for marker in (
              '/financas/calculadoras/salario-liquido-clt/',
              '/financas/calculadoras/decimo-terceiro/',
              '/financas/calculadoras/ferias-clt/',
              '/financas/calculadoras/rescisao-clt/',
              'Não calcula FGTS',
              'aviso prévio',
          ):
              assert marker in h25, marker
          assert bodies['H26'].count('20260916-f06f10') == 2

          status, body, _ = fetch(base + '/blog/wp-json/sfa/v1/fiscal-health')
          assert status == 200
          health = json.loads(body.decode('utf-8'))
          assert health['status'] == 'healthy'
          assert health['release_id'] == expected_release

          status, body, _ = fetch(base + '/blog/wp-json/sfa/v1/fiscal-release')
          assert status == 200
          release = json.loads(body.decode('utf-8'))
          assert release['release_id'] == expected_release

          status, _body, _ = fetch(base + '/folha')
          assert status == 410, status

          result = {
              'schema_version': '1.0.0',
              'checkpoint': 'V2_POST_DEPLOY',
              'status': 'PASS',
              'production_deployed': True,
              'bundle_manifest_sha256': expected_bundle_sha,
              'preflight_evidence_sha256': expected_preflight_sha,
              'release_id': expected_release,
              'managed_files_verified': len(managed),
              'dependencies_verified_unchanged': len(dependencies),
              'php_files_linted': php_checked,
              'http': http,
              'h25_boundary_markers': 'PASS',
              'h26_cache_key_occurrences': 2,
              'fiscal_health': {'status': health['status'], 'release_id': health['release_id']},
              'legacy_folha_http_status': 410,
          }
          out = stage / 'postdeploy-evidence.json'
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          print('__SANIDA_POSTDEPLOY_BEGIN__')
          import base64
          print(base64.b64encode(out.read_bytes()).decode('ascii'))
          print('__SANIDA_POSTDEPLOY_END__')
          PYREMOTE

          awk '/__SANIDA_POSTDEPLOY_BEGIN__/{flag=1;next}/__SANIDA_POSTDEPLOY_END__/{flag=0}flag' /tmp/h25-v2-postdeploy.log \
            | tr -d '\n' | base64 --decode > /tmp/h25-v2-postdeploy-evidence.json
          test -s /tmp/h25-v2-postdeploy-evidence.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/h25-v2-postdeploy-evidence.json'))
          assert d['status']=='PASS'
          assert d['managed_files_verified']==33
          assert d['dependencies_verified_unchanged']==11
          assert d['h25_boundary_markers']=='PASS'
          assert d['h26_cache_key_occurrences']==2
          assert d['fiscal_health']['status']=='healthy'
          assert d['legacy_folha_http_status']==410
          print('V2_POSTDEPLOY=PASS')
          PY

      - name: Upload post-deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: h25-v2-postdeploy-${{ github.sha }}
          path: /tmp/h25-v2-postdeploy-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
