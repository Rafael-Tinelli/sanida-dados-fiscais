name: Phase 4 A01-A04 README Sync

on:
  push:
    branches:
      - refactor/sources-sensors-v1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/sources-sensors-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Sync README
        run: python scripts/_sync_readme_phase4_audit.py
      - name: Commit README if changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: registrar correções A01-A04 da Fase 4"
          git push origin refactor/sources-sensors-v1
