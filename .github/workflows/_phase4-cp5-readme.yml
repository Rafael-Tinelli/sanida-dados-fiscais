name: Phase 4 CP5 README Sync

on:
  push:
    branches:
      - refactor/sources-sensors-v1
    paths:
      - .github/workflows/_phase4-cp5-readme.yml
      - scripts/_phase4_cp5_readme.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/sources-sensors-v1
      - name: Update README and remove helper files
        run: |
          python scripts/_phase4_cp5_readme.py
          rm -f scripts/_phase4_cp5_readme.py .github/workflows/_phase4-cp5-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/_phase4_cp5_readme.py .github/workflows/_phase4-cp5-readme.yml
          git commit -m "docs: registrar persistência de produção na Fase 4"
          git push origin HEAD:refactor/sources-sensors-v1
