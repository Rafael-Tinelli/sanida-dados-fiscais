name: H25 V2 Controlled Deploy

on:
  push:
    branches:
      - deploy/h25-v2-preflight-run

permissions:
  contents: read
  actions: read

concurrency:
  group: h25-v2-controlled-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: "2222"
      SITE_ROOT: /home1/sanid210/public_html
      PLUGIN_ROOT: /home1/sanid210/public_html/blog/wp-content/plugins/sanida-fiscais-auto
      REPO_URL: https://github.com/Rafael-Tinelli/sanida-dados-fiscais.git
      AUTH_ID: v2-c74-20260917-a741aa78-4ca95de8
      AUTH_FILE: ops/phase7-v2-authorization-20260917.json
      PREFLIGHT_RUN_ID: "35215782976"
      PREFLIGHT_ARTIFACT: h25-v2-hostgator-preflight-20734ebbedee2681af2a111381759772500f45ed
      EXPECTED_BUNDLE_SHA: 4ca95de84822fc3bc70ee59c86e73e540e38bec9e6ce5951266ce62a7f8e6627
      EXPECTED_PREFLIGHT_SHA: 3debda4e9c18cc5bde643d1a93b9960a594586bbd5b27f8f42838b862600b248
      HEALTH_BASE_URL: https://sanida.com.br

    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prove v2 apply and rollback before SSH
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_phase7_c71_v2.py \
            tests/test_phase7_v2_remote_preflight.py \
            tests/test_phase7_v2_controlled_deploy.py
          echo "V2_DEPLOY_SIMULATION=PASS"

      - name: Build exact authorized v2 bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/h25-v2-deploy-bundle /tmp/h25-v2-deploy-bundle.tgz
          python scripts/build_phase7_c71_bundle_v2.py --output-dir /tmp/h25-v2-deploy-bundle
          observed="$(sha256sum /tmp/h25-v2-deploy-bundle/bundle-manifest.json | awk '{print $1}')"
          test "$observed" = "$EXPECTED_BUNDLE_SHA"
          python scripts/validate_phase7_c71_v2_gate.py
          tar -C /tmp/h25-v2-deploy-bundle -czf /tmp/h25-v2-deploy-bundle.tgz .
          echo "AUTHORIZED_BUNDLE_SHA=$observed"

      - name: Download exact successful HostGator preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREFLIGHT_ARTIFACT }}
          path: /tmp/h25-v2-preflight-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PREFLIGHT_RUN_ID }}

      - name: Validate authorization bindings locally
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=/tmp/h25-v2-preflight-artifact/h25-v2-preflight.json
          test -f "$EVIDENCE"
          observed_evidence="$(sha256sum "$EVIDENCE" | awk '{print $1}')"
          test "$observed_evidence" = "$EXPECTED_PREFLIGHT_SHA"
          python scripts/validate_phase7_v2_remote_evidence.py \
            --evidence "$EVIDENCE" \
            --bundle-manifest /tmp/h25-v2-deploy-bundle/bundle-manifest.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          auth = json.loads(Path(os.environ['AUTH_FILE']).read_text(encoding='utf-8'))
          candidate = auth['candidate']
          assert auth['status'] == 'AUTHORIZED_READY_TO_DEPLOY'
          assert auth['authorization_id'] == os.environ['AUTH_ID']
          assert auth['single_use_authorization'] is True
          assert auth['deployment_authorized'] is True
          assert auth['production_deployed'] is False
          assert candidate['bundle_manifest_sha256'] == os.environ['EXPECTED_BUNDLE_SHA']
          assert candidate['c73_remote_evidence_sha256'] == os.environ['EXPECTED_PREFLIGHT_SHA']
          assert candidate['managed_files'] == 33
          assert candidate['preexisting_dependencies'] == 11
          assert candidate['planned_directory_creations'] == 0
          print('V2_AUTHORIZATION_BINDING=PASS')
          PY

      - name: Verify HostGator credential contract
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for item in HOST USER SSH_KEY KNOWN_HOSTS; do
            test -n "${!item:-}"
          done
          echo "HOSTGATOR_CREDENTIALS=PRESENT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          test -s "$HOME/.ssh/known_hosts"
          echo "SSH_RUNTIME_CONFIG=PASS"

      - name: Controlled single-use production deployment
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          SCP_OPTS=(
            -P "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
          )
          EVIDENCE=/tmp/h25-v2-preflight-artifact/h25-v2-preflight.json
          STAGE="h25-v2-deploy-stage/$GITHUB_SHA"

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p \"\$HOME/$STAGE\""
          scp "${SCP_OPTS[@]}" /tmp/h25-v2-deploy-bundle.tgz "$USER@$HOST:$STAGE/bundle.tgz"
          scp "${SCP_OPTS[@]}" "$EVIDENCE" "$USER@$HOST:$STAGE/preflight.json"
          scp "${SCP_OPTS[@]}" "$AUTH_FILE" "$USER@$HOST:$STAGE/authorization.json"

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s -- \
            "$GITHUB_SHA" "$REPO_URL" "$SITE_ROOT" "$PLUGIN_ROOT" "$AUTH_ID" \
            "$EXPECTED_BUNDLE_SHA" "$EXPECTED_PREFLIGHT_SHA" "$HEALTH_BASE_URL" <<'REMOTE' | tee /tmp/h25-v2-deploy-remote.log
          set -euo pipefail
          COMMIT="$1"
          REPO_URL="$2"
          SITE_ROOT="$3"
          PLUGIN_ROOT="$4"
          AUTH_ID="$5"
          EXPECTED_BUNDLE_SHA="$6"
          EXPECTED_PREFLIGHT_SHA="$7"
          HEALTH_BASE_URL="$8"

          STAGE="$HOME/h25-v2-deploy-stage/$COMMIT"
          REPO="$STAGE/repo"
          BUNDLE="$STAGE/bundle"
          EVIDENCE="$STAGE/preflight.json"
          AUTH="$STAGE/authorization.json"
          JOURNAL="$HOME/sanida-v2-deploy-journals/$AUTH_ID"

          if [ -e "$JOURNAL" ]; then
            echo "SINGLE_USE_JOURNAL_ALREADY_EXISTS=$JOURNAL"
            exit 20
          fi
          test -f "$STAGE/bundle.tgz"
          test -f "$EVIDENCE"
          test -f "$AUTH"
          mkdir -p "$BUNDLE"
          tar -C "$BUNDLE" -xzf "$STAGE/bundle.tgz"
          test "$(sha256sum "$BUNDLE/bundle-manifest.json" | awk '{print $1}')" = "$EXPECTED_BUNDLE_SHA"
          test "$(sha256sum "$EVIDENCE" | awk '{print $1}')" = "$EXPECTED_PREFLIGHT_SHA"

          git clone --quiet "$REPO_URL" "$REPO"
          cd "$REPO"
          git checkout --quiet --detach "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"

          PY="$(command -v python3.9 || command -v python3 || true)"
          test -n "$PY"
          export PYTHONPATH="$REPO"
          "$PY" -m py_compile \
            scripts/run_phase7_c74_controlled_deploy.py \
            scripts/run_phase7_v2_host_preflight.py \
            scripts/run_phase7_v2_controlled_deploy.py
          echo "REMOTE_DEPLOY_CODE_COMPILE=PASS"

          set +e
          "$PY" scripts/run_phase7_v2_controlled_deploy.py \
            --bundle-dir "$BUNDLE" \
            --site-root "$SITE_ROOT" \
            --wordpress-plugin-dir "$PLUGIN_ROOT" \
            --c73-evidence "$EVIDENCE" \
            --authorization-file "$AUTH" \
            --authorization-id "$AUTH_ID" \
            --journal-dir "$JOURNAL" \
            --health-base-url "$HEALTH_BASE_URL" \
            | tee "$STAGE/deploy-result.log"
          deploy_rc=${PIPESTATUS[0]}
          set -e

          if [ -f "$JOURNAL/deployment-state.json" ]; then
            echo "DEPLOYMENT_STATE_SHA256=$(sha256sum "$JOURNAL/deployment-state.json" | awk '{print $1}')"
            echo "__SANIDA_DEPLOYMENT_STATE_BEGIN__"
            base64 "$JOURNAL/deployment-state.json" | tr -d '\n'
            echo
            echo "__SANIDA_DEPLOYMENT_STATE_END__"
          fi
          echo "DEPLOY_RETURN_CODE=$deploy_rc"
          exit "$deploy_rc"
          REMOTE

          awk '/__SANIDA_DEPLOYMENT_STATE_BEGIN__/{flag=1;next}/__SANIDA_DEPLOYMENT_STATE_END__/{flag=0}flag' /tmp/h25-v2-deploy-remote.log \
            | tr -d '\n' \
            | base64 --decode > /tmp/h25-v2-deployment-state.json
          test -s /tmp/h25-v2-deployment-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('/tmp/h25-v2-deployment-state.json').read_text(encoding='utf-8'))
          assert state['status'] == 'APPLIED_HEALTHY', state
          assert state['production_deployed'] is True, state
          assert state['rollback_performed'] is False, state
          assert state['release_id'].startswith('fiscal-v1-sha256-a741aa7873950d')
          assert state['health']['H25']['http_status'] == 200
          assert state['health']['H25']['required_markers'] == 'PASS'
          print('V2_DEPLOYMENT_STATE=APPLIED_HEALTHY')
          PY

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h25-v2-deployment-${{ github.sha }}
          path: |
            /tmp/h25-v2-deployment-state.json
            /tmp/h25-v2-deploy-remote.log
          if-no-files-found: warn
          retention-days: 30

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
