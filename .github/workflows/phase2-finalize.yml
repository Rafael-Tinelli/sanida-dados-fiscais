name: Phase 2 Finalize Contract

on:
  push:
    branches:
      - refactor/fiscal-contract-v1
    paths:
      - scripts/finalize_phase2_contract.py
      - scripts/fix_phase2_candidate_targets.py
      - .github/workflows/phase2-finalize.yml

permissions:
  contents: write

concurrency:
  group: phase2-finalize-contract
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refactor/fiscal-contract-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Synchronize final Phase 2 contract
        run: |
          python scripts/finalize_phase2_contract.py
          python scripts/fix_phase2_candidate_targets.py

      - name: Regenerate public JSON Schema
        run: python scripts/generate_contract_schema.py

      - name: Validate final contract
        run: |
          python scripts/validate_contract_v1.py
          python -m pytest -q tests/test_contract_v1.py

      - name: Commit synchronized artifacts
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contracts/fiscal-contract-v1.schema.json contracts/examples/fiscal-contract-v1.example.json docs/contract-coverage-v1.json scripts/validate_contract_v1.py tests/test_contract_v1.py
          git commit -m "feat(contract): fechar estabilidade do Contrato Fiscal v1"
          git push origin HEAD:refactor/fiscal-contract-v1
