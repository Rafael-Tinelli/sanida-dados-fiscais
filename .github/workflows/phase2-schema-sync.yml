name: Phase 2 Schema Sync

on:
  push:
    branches:
      - refactor/fiscal-contract-v1
    paths:
      - scripts/sync_phase2_schema_coverage.py
      - .github/workflows/phase2-schema-sync.yml

permissions:
  contents: write

concurrency:
  group: phase2-schema-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refactor/fiscal-contract-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt

      - name: Build candidate and schema
        run: python scripts/sync_phase2_schema_coverage.py

      - name: Validate candidate and schema
        run: |
          python scripts/validate_contract_v1.py
          python -m pytest -q tests/test_contract_v1.py

      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- contracts/fiscal-contract-v1.schema.json contracts/examples/fiscal-contract-v1.example.json; then
            echo "Generated artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contracts/fiscal-contract-v1.schema.json contracts/examples/fiscal-contract-v1.example.json
          git commit -m "chore(contract): regenerar candidate e JSON Schema v1"
          git push origin HEAD:refactor/fiscal-contract-v1
