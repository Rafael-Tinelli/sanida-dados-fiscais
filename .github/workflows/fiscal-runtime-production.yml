name: Fiscal Runtime Production Sync

on:
  push:
    branches: [main]
    paths:
      - 'consumers/**/folha-core.js'
      - 'consumers/**/folha-thirteenth.js'
      - 'consumers/**/folha-vacation.js'
      - 'consumers/**/folha-termination.js'
      - 'consumers/runtime/salario-liquido-runtime.js'
      - 'consumers/runtime/decimo-terceiro-runtime.js'
      - 'scripts/deploy_fiscal_runtime_assets.py'
      - 'ops/fiscal-runtime-assets.htaccess'
      - '.github/workflows/fiscal-runtime-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiscal-runtime-production
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: "2222"
      SITE_ROOT: /home1/sanid210/public_html
      JOURNAL_ROOT: /home1/sanid210/sanida-fiscal-runtime-deployments
      REPO_URL: https://github.com/Rafael-Tinelli/sanida-dados-fiscais.git

    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Gate repository before production
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests
          python scripts/validate_repository.py
          python scripts/validate_contract_v1.py
          python scripts/generate_contract_schema_v12.py --check
          for file in             consumers/frontend/folha-core.js             consumers/runtime/salario-liquido-runtime.js             consumers/frontend/folha-thirteenth.js             consumers/runtime/decimo-terceiro-runtime.js             consumers/frontend/folha-vacation.js             consumers/frontend/folha-termination.js
          do
            node --check "$file"
          done
          echo "FISCAL_RUNTIME_PREDEPLOY_GATE=PASS"

      - name: Verify HostGator credential contract
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for item in HOST USER SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!item:-}" ]; then
              echo "HOSTGATOR_CREDENTIAL_MISSING=$item"
              missing=1
            fi
          done
          test "$missing" -eq 0
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "HOSTGATOR_CREDENTIALS=PASS"

      - name: Apply exact fiscal runtime commit on HostGator
        id: deploy
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          AUTHORIZATION_ID="runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          echo "authorization_id=$AUTHORIZATION_ID" >> "$GITHUB_OUTPUT"

          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s --             "$GITHUB_SHA"             "$GITHUB_RUN_ID"             "$GITHUB_RUN_ATTEMPT"             "$REPO_URL"             "$SITE_ROOT"             "$JOURNAL_ROOT"             "$AUTHORIZATION_ID" <<'REMOTE' | tee /tmp/fiscal-runtime-remote.log
          set -euo pipefail
          COMMIT="$1"
          RUN_ID="$2"
          RUN_ATTEMPT="$3"
          REPO_URL="$4"
          SITE_ROOT="$5"
          JOURNAL_ROOT="$6"
          AUTHORIZATION_ID="$7"

          RUNTIME="$HOME/sanida-fiscal-runtime-runs/${RUN_ID}-${RUN_ATTEMPT}"
          REPO="$RUNTIME/repo"
          JOURNAL="$JOURNAL_ROOT/$AUTHORIZATION_ID"

          test ! -e "$RUNTIME"
          mkdir -p "$RUNTIME"

          git clone --quiet "$REPO_URL" "$REPO"
          git -C "$REPO" checkout --quiet --detach "$COMMIT"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$COMMIT"

          PY="$(command -v python3.9 || command -v python3 || true)"
          test -n "$PY"

          set +e
          "$PY" "$REPO/scripts/deploy_fiscal_runtime_assets.py" deploy             --site-root "$SITE_ROOT"             --journal-root "$JOURNAL_ROOT"             --authorized-commit "$COMMIT"             --authorization-id "$AUTHORIZATION_ID"             > "$RUNTIME/deploy-output.json"
          RC=$?
          set -e

          cat "$RUNTIME/deploy-output.json"
          test -f "$JOURNAL/deployment-state.json"
          echo "__SANIDA_RUNTIME_STATE_BEGIN__"
          base64 "$JOURNAL/deployment-state.json" | tr -d '\n'
          echo
          echo "__SANIDA_RUNTIME_STATE_END__"
          echo "RUNTIME_STATE_SHA256=$(sha256sum "$JOURNAL/deployment-state.json" | awk '{print $1}')"
          echo "RUNTIME_DEPLOY_RC=$RC"
          exit "$RC"
          REMOTE

          awk '/__SANIDA_RUNTIME_STATE_BEGIN__/{flag=1;next}/__SANIDA_RUNTIME_STATE_END__/{flag=0}flag'             /tmp/fiscal-runtime-remote.log | tr -d '\n' | base64 --decode > /tmp/fiscal-runtime-state.json
          test -s /tmp/fiscal-runtime-state.json

          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/fiscal-runtime-state.json").read_text(encoding="utf-8"))
          assert d.get("status") == "APPLIED_ORIGIN_HEALTHY_PENDING_EXTERNAL"
          assert d.get("origin_health_verified") is True
          assert d.get("external_delivery_verified") is False
          assert d.get("rollback_performed") is False
          print("FISCAL_RUNTIME_ORIGIN_GATE=PASS")
          PY

      - name: Prove canonical public runtime bytes and cache policy
        shell: python
        env:
          AUTHORIZATION_ID: ${{ steps.deploy.outputs.authorization_id }}
        run: |
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          from scripts.deploy_fiscal_runtime_assets import RUNTIME_ASSETS

          commit = os.environ["GITHUB_SHA"]
          ua = "Mozilla/5.0 Sanida-Fiscal-Runtime-External/1.0"
          rows = []
          blocks = []

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def fetch(url):
              req = Request(
                  url,
                  headers={
                      "User-Agent": ua,
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              try:
                  with urlopen(req, timeout=30) as response:
                      return int(response.status), response.read(), {
                          k.lower(): v for k, v in response.headers.items()
                      }
              except HTTPError as exc:
                  return int(exc.code), exc.read(), {
                      k.lower(): v for k, v in exc.headers.items()
                  }
              except URLError as exc:
                  raise RuntimeError(f"external request failed: {url}: {exc}") from exc

          for item in RUNTIME_ASSETS:
              expected = sha256(Path(item["source"]).read_bytes())
              canonical_status = None
              canonical_body = b""
              canonical_headers = {}
              for attempt in range(3):
                  canonical_status, canonical_body, canonical_headers = fetch(item["public_url"])
                  if canonical_status == 200 and sha256(canonical_body) == expected:
                      break
                  time.sleep(5)

              public_sha = sha256(canonical_body) if canonical_status == 200 else None
              cache_control = canonical_headers.get("cache-control", "")
              match = canonical_status == 200 and public_sha == expected
              no_store = "no-store" in cache_control.lower()

              row = {
                  "target": item["target"],
                  "public_url": item["public_url"],
                  "http_status": canonical_status,
                  "expected_sha256": expected,
                  "public_sha256": public_sha,
                  "match": match,
                  "cache_control": cache_control,
                  "cache_policy_active": no_store,
              }
              rows.append(row)

              if not match:
                  blocks.append(f"public_asset_mismatch:{item['target']}")
              if not no_store:
                  blocks.append(f"cache_policy_missing:{item['target']}")

          evidence = {
              "schema_version": "1.0.0",
              "status": "PASS" if not blocks else "BLOCKED",
              "authorized_commit": commit,
              "authorization_id": os.environ["AUTHORIZATION_ID"],
              "assets_expected": len(RUNTIME_ASSETS),
              "assets_matching": sum(1 for row in rows if row["match"]),
              "assets": rows,
              "block_reasons": blocks,
          }
          Path("/tmp/fiscal-runtime-external.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          if blocks:
              raise SystemExit(3)

      - name: Finalize runtime deployment journal
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
          AUTHORIZATION_ID: ${{ steps.deploy.outputs.authorization_id }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          EVIDENCE_B64="$(base64 -w0 /tmp/fiscal-runtime-external.json)"
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s --             "$GITHUB_SHA"             "$GITHUB_RUN_ID"             "$GITHUB_RUN_ATTEMPT"             "$REPO_URL"             "$JOURNAL_ROOT"             "$AUTHORIZATION_ID"             "$EVIDENCE_B64" <<'REMOTE' | tee /tmp/fiscal-runtime-finalize.log
          set -euo pipefail
          COMMIT="$1"
          RUN_ID="$2"
          RUN_ATTEMPT="$3"
          REPO_URL="$4"
          JOURNAL_ROOT="$5"
          AUTHORIZATION_ID="$6"
          EVIDENCE_B64="$7"

          RUNTIME="$HOME/sanida-fiscal-runtime-finalize/${RUN_ID}-${RUN_ATTEMPT}"
          REPO="$RUNTIME/repo"
          JOURNAL="$JOURNAL_ROOT/$AUTHORIZATION_ID"
          EVIDENCE="$RUNTIME/external-evidence.json"

          test ! -e "$RUNTIME"
          mkdir -p "$RUNTIME"
          git clone --quiet "$REPO_URL" "$REPO"
          git -C "$REPO" checkout --quiet --detach "$COMMIT"
          test "$(git -C "$REPO" rev-parse HEAD)" = "$COMMIT"

          printf '%s' "$EVIDENCE_B64" | base64 --decode > "$EVIDENCE"

          PY="$(command -v python3.9 || command -v python3 || true)"
          test -n "$PY"
          "$PY" "$REPO/scripts/deploy_fiscal_runtime_assets.py" finalize             --journal-dir "$JOURNAL"             --external-evidence "$EVIDENCE"             --authorized-commit "$COMMIT"             --authorization-id "$AUTHORIZATION_ID"             > "$RUNTIME/finalize-output.json"

          cat "$RUNTIME/finalize-output.json"
          echo "__SANIDA_RUNTIME_FINAL_STATE_BEGIN__"
          base64 "$JOURNAL/deployment-state.json" | tr -d '\n'
          echo
          echo "__SANIDA_RUNTIME_FINAL_STATE_END__"
          REMOTE

          awk '/__SANIDA_RUNTIME_FINAL_STATE_BEGIN__/{flag=1;next}/__SANIDA_RUNTIME_FINAL_STATE_END__/{flag=0}flag'             /tmp/fiscal-runtime-finalize.log | tr -d '\n' | base64 --decode > /tmp/fiscal-runtime-final-state.json

          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("/tmp/fiscal-runtime-final-state.json").read_text(encoding="utf-8"))
          assert d.get("status") == "APPLIED_EXTERNALLY_HEALTHY"
          assert d.get("origin_health_verified") is True
          assert d.get("external_delivery_verified") is True
          assert d.get("final_health_status") == "HEALTHY"
          assert d.get("rollback_performed") is False
          print("FISCAL_RUNTIME_FINAL_GATE=PASS")
          PY

      - name: Upload runtime deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-runtime-production-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/fiscal-runtime-remote.log
            /tmp/fiscal-runtime-state.json
            /tmp/fiscal-runtime-external.json
            /tmp/fiscal-runtime-finalize.log
            /tmp/fiscal-runtime-final-state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
