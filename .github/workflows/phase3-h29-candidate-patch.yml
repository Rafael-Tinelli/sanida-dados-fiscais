name: Phase 3 H29 Candidate Patch

on:
  push:
    branches:
      - refactor/fiscal-engine-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refactor/fiscal-engine-v1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply H29 candidate patch
        run: python scripts/phase3_patch_h29_candidate.py

      - name: Regenerate JSON Schema
        run: python scripts/generate_contract_schema.py

      - name: Validate patched checkpoint
        run: |
          python scripts/validate_repository.py
          python scripts/validate_contract_v1.py
          python -m pytest -q tests

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "H29 candidate already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sanida_fiscal/types_v1.py contracts/examples/fiscal-contract-v1.example.json contracts/fiscal-contract-v1.schema.json docs/phase2-to-phase3-handoff.md
          git commit -m "feat: materializar elegibilidade de ferias proporcionais no H29"
          git push origin HEAD:refactor/fiscal-engine-v1
