name: Phase 3 Memory Docs Sync

on:
  push:
    branches:
      - refactor/fiscal-engine-v1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refactor/fiscal-engine-v1
          fetch-depth: 0

      - name: Sync README and Phase 3 docs
        run: python scripts/sync_phase3_memory_docs.py

      - name: Remove temporary sync helpers and commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm scripts/sync_phase3_memory_docs.py .github/workflows/phase3-memory-docs-sync.yml
          git add README.md docs/phase3-library-v1.md
          git commit -m "docs: registrar checkpoint de memória e gate da Fase 3"
          git push origin HEAD:refactor/fiscal-engine-v1
