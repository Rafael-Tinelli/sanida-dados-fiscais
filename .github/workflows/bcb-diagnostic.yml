name: BCB SGS connectivity diagnosis (manual, read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install source dependencies
        run: pip install -r requirements-sources.txt
      - name: Probe official BCB endpoints without updating any state
        run: python scripts/diagnose_bcb_transport.py
