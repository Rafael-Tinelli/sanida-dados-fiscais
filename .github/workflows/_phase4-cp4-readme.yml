name: Phase 4 CP4 README Cleanup

on:
  push:
    branches:
      - refactor/sources-sensors-v1
    paths:
      - .github/workflows/_phase4-cp4-readme.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/sources-sensors-v1
      - name: Finalize README wording and remove helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'O pipeline de produção continua congelado: `scraper.py`, `update_taxas.py`, `dados_fiscais.json`, `taxas_bacen.json`, WordPress, `folha-core` e H26–H29 ainda não foram migrados.'
          new = 'A ativação em `main`/produção continua congelada: nesta branch `scraper.py` já foi migrado para a fronteira de compatibilidade, mas `dados_fiscais.json`, `update_taxas.py`, `taxas_bacen.json`, WordPress, `folha-core` e H26–H29 publicados ainda não foram ativados/migrados pelo merge.'
          if old not in text:
              raise SystemExit('production-boundary sentence not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/_phase4_cp4_readme.py .github/workflows/_phase4-cp4-readme.yml
          git add README.md
          git commit -m "docs: fechar checkpoint de transição do scraper"
          git push origin HEAD:refactor/sources-sensors-v1
