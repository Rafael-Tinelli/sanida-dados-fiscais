name: Phase 4 CP4 README Sync

on:
  push:
    branches:
      - refactor/sources-sensors-v1
    paths:
      - .github/workflows/_phase4-cp4-readme.yml
      - scripts/_phase4_cp4_readme.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/sources-sensors-v1
      - run: python scripts/_phase4_cp4_readme.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: registrar transição do scraper na Fase 4"
          git push origin HEAD:refactor/sources-sensors-v1
