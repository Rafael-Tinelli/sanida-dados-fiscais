name: Diagnostic - eSocial same TLS on GitHub and HostGator

on:
  push:
    branches: [diagnostics/esocial-two-network-20261125]
    paths:
      - .github/workflows/diagnose-esocial-two-networks.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Pin one eSocial official URL, IPv4 and CA PEM for both networks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, socket, ssl
          from urllib.parse import urlsplit
          registry=json.loads(pathlib.Path("docs/source-registry-v1.json").read_text("utf-8"))
          entry=next(x for x in registry["sources"] if x["source_id"]=="ESOCIAL_TABLES_S13_NT07_2026")
          u=urlsplit(entry["url"])
          assert u.hostname=="www.gov.br" and u.scheme=="https"
          addresses=sorted({x[4][0] for x in socket.getaddrinfo(u.hostname,443,type=socket.SOCK_STREAM) if x[0]==socket.AF_INET})
          assert addresses, "www.gov.br: no IPv4 resolved"
          source=pathlib.Path("ops/diagnostics/compare_esocial_networks.py").read_text("utf-8")
          ca_path=ssl.get_default_verify_paths().cafile
          assert ca_path, "runner did not provide a CA PEM"
          ca=pathlib.Path(ca_path).read_text("ascii")
          assert "BEGIN CERTIFICATE" in ca
          bundle={"host":u.hostname,"ip":addresses[0],"path":u.path,"ca_pem":ca,"source":source}
          pathlib.Path(os.environ["RUNNER_TEMP"],"esocial-two-network-bundle.json").write_text(json.dumps(bundle),encoding="utf-8")
          print("PINNED_HOST=www.gov.br")
          print("PINNED_IPV4="+addresses[0])
          print("TLS_VERSIONS=1.2,1.3")
          print("SNI=www.gov.br")
          print("CERTIFICATE_VERIFICATION=enabled with identical CA bundle")
          PY
      - name: Configure existing SSH access (host-key pinned)
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          REMOTE_USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for field in REMOTE_HOST REMOTE_USER SSH_KEY KNOWN_HOSTS; do
            [ -n "${!field:-}" ] || { echo "Missing existing SSH credential: $field"; exit 2; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
      - name: Run exactly the same script on GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          PY_CODE='import json,sys; b=json.load(sys.stdin); exec(compile(b["source"],"probe.py","exec"),{"__name__":"__main__","BUNDLE":b})'
          NETWORK_LABEL=github_actions python3 -c "$PY_CODE" \
            < "$RUNNER_TEMP/esocial-two-network-bundle.json" | tee "$RUNNER_TEMP/esocial-gh.json"
      - name: Run exactly the same script on HostGator through SSH stdin
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          REMOTE_USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          PY_CODE='import json,sys; b=json.load(sys.stdin); exec(compile(b["source"],"probe.py","exec"),{"__name__":"__main__","BUNDLE":b})'
          ssh -T -p 2222 -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=20 "$REMOTE_USER@$REMOTE_HOST" \
            "NETWORK_LABEL=hostgator python3 -c '$PY_CODE'" \
            < "$RUNNER_TEMP/esocial-two-network-bundle.json" | tee "$RUNNER_TEMP/esocial-hostgator.json"
      - name: Verify identical controls and compare observed failures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          t=pathlib.Path(os.environ["RUNNER_TEMP"])
          g=json.loads((t/"esocial-gh.json").read_text())
          h=json.loads((t/"esocial-hostgator.json").read_text())
          for field in ("hostname","pinned_ipv4","request_path","ca_sha256","probe_sha256"):
              assert g[field]==h[field], f"CONTROL_DRIFT_{field}"
          assert g["network"]=="github_actions" and h["network"]=="hostgator"
          print("CONTROL_IDENTICAL=PASS")
          print("TLS_CONFIG=SNI www.gov.br; TLS1.2 and TLS1.3 individually pinned; CERT_REQUIRED; same CA PEM")
          for field in ("tcp_ipv4","tls12","tls13"):
              print(field.upper()+"_GH="+json.dumps(g[field],ensure_ascii=False,sort_keys=True))
              print(field.upper()+"_HOSTGATOR="+json.dumps(h[field],ensure_ascii=False,sort_keys=True))
          print("PYTHON_OPENSSL_GH="+g["python"]+" / "+g["openssl"])
          print("PYTHON_OPENSSL_HOSTGATOR="+h["python"]+" / "+h["openssl"])
          print("TWO_NETWORK_PROBE_COMPLETE=TRUE")
          PY
