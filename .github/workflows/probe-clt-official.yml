name: Probe official fiscal authorities (read-only)
on:
  push:
    branches:
      - probe/planalto-diagnostics-20261111

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install declared dependencies
        run: python -m pip install --quiet -r requirements-dev.txt
      - name: Probe four official Cámara sources using fiscal collector
        timeout-minutes: 4
        run: PYTHONPATH=. python scripts/diagnose_remaining_planalto_20261111.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-remaining-authorities
          path: .validation/remaining-planalto-sources.json
          if-no-files-found: warn
          retention-days: 7
