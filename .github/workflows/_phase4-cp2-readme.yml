name: Phase 4 CP2 README Sync

on:
  push:
    branches: [refactor/sources-sensors-v1]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/sources-sensors-v1
      - run: python scripts/_phase4_sync_readme.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_phase4-cp2-readme.yml scripts/_phase4_sync_readme.py
          git add README.md
          git commit -m "docs: registrar pipeline RFB na Fase 4 [phase4-cp2-readme]"
          git push origin HEAD:refactor/sources-sensors-v1
