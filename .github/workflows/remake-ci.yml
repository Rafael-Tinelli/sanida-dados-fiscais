name: Remake CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remake-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install contract validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m compileall -q scraper.py update_taxas.py scripts tests sanida_fiscal

      - name: Validate repository baseline and reference cases
        run: |
          python scripts/validate_repository.py

      - name: Validate Fiscal Contract v1
        run: |
          python scripts/validate_contract_v1.py

      - name: Run contract tests
        run: |
          pytest -q tests/test_contract_v1.py
