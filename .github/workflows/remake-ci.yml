name: Remake CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remake-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation and engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m compileall -q scraper.py update_taxas.py scripts tests sanida_fiscal

      - name: Validate repository baseline and reference cases
        run: |
          python scripts/validate_repository.py

      - name: Validate Fiscal Contract v1
        run: |
          python scripts/validate_contract_v1.py

      - name: Validate Fiscal Contract v1.2 schema generation
        run: |
          python scripts/generate_contract_schema_v12.py --output /tmp/fiscal-contract-v1.2.schema.json
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('/tmp/fiscal-contract-v1.2.schema.json').read_text(encoding='utf-8'))
          assert schema['$id'] == 'https://sanida.com.br/schemas/fiscal-contract-v1.2.schema.json'
          assert schema['properties']['schema_version']['const'] == '1.2.0'
          assert 'GovernanceEvidenceObservation' in schema['$defs']
          print('Fiscal Contract v1.2 generated schema: PASS')
          PY

      - name: Run contract and fiscal-engine tests
        run: |
          python -m pytest -q tests

      - name: Validate Phase 3 closure gate
        run: |
          python scripts/validate_phase3_gate.py

      - name: Validate Phase 4 foundation
        run: |
          python scripts/validate_phase4_foundation.py

      - name: Validate Phase 4 production boundary
        run: |
          python scripts/validate_phase4_preclosure_gate.py

      - name: Validate Phase 4 formal closure gate
        run: |
          python scripts/validate_phase4_closure_gate.py

      - name: Validate Phase 5 semantic-diff foundation
        run: |
          python scripts/validate_phase5_foundation.py

      - name: Validate Phase 5 publication foundation
        run: |
          python scripts/validate_phase5_publication_foundation.py

      - name: Validate Phase 5 formal closure gate
        run: |
          python scripts/validate_phase5_closure_gate.py

      - name: Validate Phase 6 C6.0a human-review gate
        run: |
          python scripts/validate_phase6_c60a_gate.py

      - name: Validate Phase 6 C6.1 WordPress consumer gate
        run: |
          python scripts/validate_phase6_c61_gate.py

      - name: Validate Phase 6 C6.2 folha-core gate
        run: |
          python scripts/validate_phase6_c62_gate.py
