name: Remake CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remake-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  af01_portal_forensics:
    if: ${{ github.head_ref == 'probe/af01-official-evidence-20261005' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install forensic dependencies
        run: pip install requests beautifulsoup4

      - name: Capture Normas portal shell and JavaScript bundles
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import re
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          root = Path("/tmp/af01-portal-forensics")
          root.mkdir(parents=True, exist_ok=True)
          old_url = "https://normas.receita.fazenda.gov.br/sijut2consulta/anexoOutros.action?idArquivoBinario=36769"
          session = requests.Session()
          session.headers.update({"User-Agent": "SanidaLegalEvidenceForensic/1.1"})
          response = session.get(old_url, timeout=(8, 20), allow_redirects=True)
          response.raise_for_status()
          (root / "portal-shell.html").write_bytes(response.content)
          soup = BeautifulSoup(response.content, "html.parser")
          parsed = urlparse(response.url)
          origin = f"{parsed.scheme}://{parsed.netloc}/"
          scripts = [urljoin(origin, tag.get("src")) for tag in soup.find_all("script") if tag.get("src")]
          report = {
              "portal": {
                  "url": response.url,
                  "status": response.status_code,
                  "content_type": response.headers.get("content-type", ""),
                  "bytes": len(response.content),
                  "sha256": sha256(response.content).hexdigest(),
              },
              "scripts": [],
              "candidate_strings": [],
          }
          needles = ("api", "anexo", "arquivo", "binario", "download", "document", "consulta", "norma", "sijut")
          seen = set()
          for index, script_url in enumerate(scripts, 1):
              js = session.get(script_url, timeout=(8, 30), allow_redirects=True)
              js.raise_for_status()
              name = script_url.rsplit("/", 1)[-1] or f"script-{index}.js"
              path = root / name
              path.write_bytes(js.content)
              report["scripts"].append({
                  "url": js.url,
                  "content_type": js.headers.get("content-type", ""),
                  "bytes": len(js.content),
                  "sha256": sha256(js.content).hexdigest(),
                  "filename": name,
              })
              text = js.text
              for match in re.finditer(r'[^"\'\s]{0,100}(?:api|anexo|arquivo|binario|download|document|consulta|norma|sijut)[^"\'\s]{0,160}', text, flags=re.I):
                  value = match.group(0)
                  key = value[:300]
                  if key not in seen:
                      seen.add(key)
                      report["candidate_strings"].append(key)
          (root / "forensic-report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n")
          print("AF01_PORTAL_FORENSICS " + json.dumps({
              "portal": report["portal"],
              "scripts": report["scripts"],
              "candidate_count": len(report["candidate_strings"]),
              "candidate_sample": report["candidate_strings"][:50],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload Normas portal forensics
        uses: actions/upload-artifact@v4
        with:
          name: af01-portal-forensics-${{ github.sha }}
          path: /tmp/af01-portal-forensics
          if-no-files-found: error
          retention-days: 3

  validate:
    if: ${{ github.head_ref != 'probe/af01-official-evidence-20261005' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation and engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python
        run: |
          python -m compileall -q scraper.py update_taxas.py update_taxas_series.py scripts tests sanida_fiscal

      - name: Validate repository baseline and reference cases
        run: |
          python scripts/validate_repository.py

      - name: Validate Fiscal Contract v1
        run: |
          python scripts/validate_contract_v1.py

      - name: Validate Fiscal Contract v1.2 schema generation
        run: |
          python scripts/generate_contract_schema_v12.py --output /tmp/fiscal-contract-v1.2.schema.json
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('/tmp/fiscal-contract-v1.2.schema.json').read_text(encoding='utf-8'))
          assert schema['$id'] == 'https://sanida.com.br/schemas/fiscal-contract-v1.2.schema.json'
          assert schema['properties']['schema_version']['const'] == '1.2.0'
          assert 'GovernanceEvidenceObservation' in schema['$defs']
          print('Fiscal Contract v1.2 generated schema: PASS')
          PY

      - name: Run contract and fiscal-engine tests
        run: |
          python -m pytest -q tests

      - name: Run real-browser calculator smoke
        run: |
          python scripts/run_calculators_browser_smoke.py

      - name: Probe AF01 official SCI evidence (read-only)
        if: ${{ github.head_ref == 'probe/af01-official-evidence-20261005' }}
        id: af01_probe
        continue-on-error: true
        run: |
          python scripts/prepare_af01_official_evidence.py --output /tmp/af01-official-evidence

      - name: Upload AF01 official evidence probe
        if: ${{ always() && github.head_ref == 'probe/af01-official-evidence-20261005' }}
        uses: actions/upload-artifact@v4
        with:
          name: af01-official-evidence-${{ github.sha }}
          path: /tmp/af01-official-evidence
          if-no-files-found: warn
          retention-days: 3

      - name: Preserve blocked AF01 response for forensic inspection
        if: ${{ always() && github.head_ref == 'probe/af01-official-evidence-20261005' }}
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          url = "https://normas.receita.fazenda.gov.br/sijut2consulta/anexoOutros.action?idArquivoBinario=36769"
          response = requests.get(
              url,
              headers={"Accept": "application/pdf,text/html;q=0.9,*/*;q=0.8", "User-Agent": "SanidaLegalEvidenceForensic/1.0"},
              timeout=(8, 20),
              allow_redirects=True,
          )
          root = Path("/tmp/af01-forensic")
          root.mkdir(parents=True, exist_ok=True)
          (root / "response.bin").write_bytes(response.content)
          meta = {
              "status": response.status_code,
              "content_type": response.headers.get("content-type", ""),
              "final_url": response.url,
              "bytes": len(response.content),
              "sha256": sha256(response.content).hexdigest(),
              "headers": dict(response.headers),
          }
          (root / "response-meta.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n")
          soup = BeautifulSoup(response.content, "html.parser")
          found = []
          for tag in soup.find_all(True):
              for attr in ("href", "src", "action", "data", "value"):
                  value = tag.get(attr)
                  if not isinstance(value, str):
                      continue
                  low = value.lower()
                  if any(token in low for token in ("pdf", "arquivo", "download", "anexo", "binario", "36769")):
                      found.append({"tag": tag.name, "attr": attr, "value": value, "absolute": urljoin(response.url, value)})
          (root / "candidate-links.json").write_text(json.dumps(found, ensure_ascii=False, indent=2) + "\n")
          print("AF01_FORENSIC " + json.dumps({"meta": meta, "candidate_links": found[:30]}, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload blocked AF01 forensic response
        if: ${{ always() && github.head_ref == 'probe/af01-official-evidence-20261005' }}
        uses: actions/upload-artifact@v4
        with:
          name: af01-blocked-response-${{ github.sha }}
          path: /tmp/af01-forensic
          if-no-files-found: error
          retention-days: 3

      - name: Diagnose recovery sources live (read-only)
        if: ${{ github.head_ref == 'fix/main-fiscal-recovery-20261005' }}
        continue-on-error: true
        run: |
          python scripts/diagnose_recovery_live_sources.py

      - name: Upload recovery source diagnosis
        if: ${{ always() && github.head_ref == 'fix/main-fiscal-recovery-20261005' }}
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-recovery-live-sources-${{ github.sha }}
          path: .validation/recovery-live-sources.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Phase 3 closure gate
        run: |
          python scripts/validate_phase3_gate.py

      - name: Validate Phase 4 foundation
        run: |
          python scripts/validate_phase4_foundation.py

      - name: Validate Phase 4 production boundary
        run: |
          python scripts/validate_phase4_preclosure_gate.py

      - name: Validate Phase 4 formal closure gate
        run: |
          python scripts/validate_phase4_closure_gate.py

      - name: Validate Phase 5 semantic-diff foundation
        run: |
          python scripts/validate_phase5_foundation.py

      - name: Validate Phase 5 publication foundation
        run: |
          python scripts/validate_phase5_publication_foundation.py

      - name: Validate Phase 5 formal closure gate
        run: |
          python scripts/validate_phase5_closure_gate.py

      - name: Validate Phase 6 C6.0a human-review gate
        run: |
          python scripts/validate_phase6_c60a_gate.py

      - name: Validate Phase 6 C6.1 WordPress consumer gate
        run: |
          python scripts/validate_phase6_c61_gate.py

      - name: Validate Phase 6 C6.2 folha-core gate
        run: |
          python scripts/validate_phase6_c62_gate.py

      - name: Validate Phase 6 C6.3 H26 gate
        run: |
          python scripts/validate_phase6_c63_gate.py

      - name: Validate Phase 6 C6.4 H27 gate
        run: |
          python scripts/validate_phase6_c64_gate.py

      - name: Validate Phase 6 C6.5 H28 gate
        run: |
          python scripts/validate_phase6_c65_gate.py

      - name: Validate Phase 6 C6.6 H29 gate
        run: |
          python scripts/validate_phase6_c66_gate.py

      - name: Validate Phase 6 C6.7 formal closure gate
        run: |
          python scripts/validate_phase6_c67_gate.py

      - name: Build Phase 7 C7.1 deployment bundle
        run: |
          python scripts/build_phase7_c71_bundle.py --output-dir /tmp/c71-deployment-bundle

      - name: Validate Phase 7 C7.1 bundle and rollback gate
        run: |
          python scripts/validate_phase7_c71_gate.py

      - name: Run Phase 7 C7.2 operational evergreen E2E
        run: |
          set -o pipefail
          python scripts/run_phase7_c72_operational_e2e.py | tee /tmp/c72-operational-e2e.json

      - name: Validate Phase 7 C7.2 evergreen recovery gate
        run: |
          python scripts/validate_phase7_c72_gate.py

      - name: Simulate Phase 7 C7.3 production preflight
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/simulate_phase7_c73_preflight.py | tee /tmp/c73-preflight-simulation.json

      - name: Validate Phase 7 C7.3 readiness gate
        run: |
          python scripts/validate_phase7_c73_gate.py

      - name: Simulate Phase 7 C7.4 controlled deployment
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/simulate_phase7_c74_controlled_deployment.py | tee /tmp/c74-controlled-deployment-simulation.json

      - name: Validate Phase 7 C7.4 authorization gate
        run: |
          PYTHONPATH=. python scripts/validate_phase7_c74_gate.py

      - name: Simulate Phase 7 C7.5 post-deploy validation
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/simulate_phase7_c75_postdeploy_validation.py | tee /tmp/c75-postdeploy-simulation.json

      - name: Validate Phase 7 C7.5 readiness gate
        run: |
          PYTHONPATH=. python scripts/validate_phase7_c75_gate.py

      - name: Upload Phase 7 C7.5 post-deploy simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: c75-postdeploy-simulation-${{ github.sha }}
          path: /tmp/c75-postdeploy-simulation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 7 C7.4 controlled deployment simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: c74-controlled-deployment-simulation-${{ github.sha }}
          path: /tmp/c74-controlled-deployment-simulation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 7 C7.3 preflight simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: c73-preflight-simulation-${{ github.sha }}
          path: /tmp/c73-preflight-simulation.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 7 C7.2 operational evidence
        uses: actions/upload-artifact@v4
        with:
          name: c72-operational-evidence-${{ github.sha }}
          path: /tmp/c72-operational-e2e.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Phase 7 C7.1 pre-deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: c71-deployment-bundle-${{ github.sha }}
          path: /tmp/c71-deployment-bundle
          if-no-files-found: error
          retention-days: 14
