name: Deploy DOBR v1.4.11

on:
  push:
    branches:
      - deploy/dobr-v1.4.11
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dobr-v1.4.11
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: "2222"
      WP_ROOT: /home1/sanid210/public_html/blog
      TARGET_DIR: /home1/sanid210/public_html/blog/wp-content/plugins/dados-oficiais-br
      SOURCE_PHP: integrations/wordpress/dados-oficiais-br/dados-oficiais-br.php
      SOURCE_JS: integrations/wordpress/dados-oficiais-br/assets/seguro-desemprego-calculadora.js
      EXPECTED_VERSION: "1.4.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail
          php -l "$SOURCE_PHP"
          node --check "$SOURCE_JS"
          grep -F "Version: $EXPECTED_VERSION" "$SOURCE_PHP"
          grep -F "enqueue_sd_calculator_asset" "$SOURCE_PHP"
          grep -F "window.__SANIDA_SD_B14_LOADED__ = true;" "$SOURCE_JS"
          sha256sum "$SOURCE_PHP" "$SOURCE_JS"

      - name: Verify HostGator credentials
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for item in HOST USER SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!item:-}" ]; then
              echo "HOSTGATOR_CREDENTIAL_MISSING=$item"
              exit 21
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Upload candidate files
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
          )
          SCP_OPTS=(
            -P "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
          )
          RUNTIME="/home1/sanid210/dobr-deploy/$GITHUB_SHA"
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p '$RUNTIME'"
          scp "${SCP_OPTS[@]}" "$SOURCE_PHP" "$USER@$HOST:$RUNTIME/dados-oficiais-br.php"
          scp "${SCP_OPTS[@]}" "$SOURCE_JS" "$USER@$HOST:$RUNTIME/seguro-desemprego-calculadora.js"

      - name: Deploy atomically and validate
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
          )

          PHP_SHA="$(sha256sum "$SOURCE_PHP" | awk '{print $1}')"
          JS_SHA="$(sha256sum "$SOURCE_JS" | awk '{print $1}')"
          RUNTIME="/home1/sanid210/dobr-deploy/$GITHUB_SHA"

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s -- \
            "$RUNTIME/dados-oficiais-br.php" \
            "$RUNTIME/seguro-desemprego-calculadora.js" \
            "$TARGET_DIR" \
            "$WP_ROOT" \
            "$EXPECTED_VERSION" \
            "$PHP_SHA" \
            "$JS_SHA" \
            "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail

          SRC_PHP="$1"
          SRC_JS="$2"
          TARGET_DIR="$3"
          WP_ROOT="$4"
          EXPECTED_VERSION="$5"
          PHP_SHA="$6"
          JS_SHA="$7"
          COMMIT="$8"

          TARGET_PHP="$TARGET_DIR/dados-oficiais-br.php"
          TARGET_JS="$TARGET_DIR/assets/seguro-desemprego-calculadora.js"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_ROOT="/home1/sanid210/backups/dados-oficiais-br-$EXPECTED_VERSION-$TS"
          TMP_PHP="$TARGET_PHP.incoming-$COMMIT"
          TMP_JS="$TARGET_JS.incoming-$COMMIT"
          DEPLOYED=0

          rollback() {
            code=$?
            if [ "$DEPLOYED" -eq 1 ]; then
              echo "ROLLBACK_START=$BACKUP_ROOT"
              if [ -s "$BACKUP_ROOT/dados-oficiais-br.php" ]; then
                cp -p "$BACKUP_ROOT/dados-oficiais-br.php" "$TARGET_PHP.rollback"
                mv -f "$TARGET_PHP.rollback" "$TARGET_PHP"
              fi
              if [ -s "$BACKUP_ROOT/seguro-desemprego-calculadora.js" ]; then
                mkdir -p "$(dirname "$TARGET_JS")"
                cp -p "$BACKUP_ROOT/seguro-desemprego-calculadora.js" "$TARGET_JS.rollback"
                mv -f "$TARGET_JS.rollback" "$TARGET_JS"
              else
                rm -f "$TARGET_JS"
              fi
              php -l "$TARGET_PHP" >/dev/null
              echo "ROLLBACK=PASS"
            fi
            rm -f "$TMP_PHP" "$TMP_JS"
            exit "$code"
          }
          trap rollback ERR

          test -s "$SRC_PHP"
          test -s "$SRC_JS"
          test -s "$TARGET_PHP"
          test -s "$WP_ROOT/wp-load.php"

          php -l "$SRC_PHP" >/dev/null
          grep -F "Version: $EXPECTED_VERSION" "$SRC_PHP" >/dev/null
          grep -F "enqueue_sd_calculator_asset" "$SRC_PHP" >/dev/null
          grep -F "window.__SANIDA_SD_B14_LOADED__ = true;" "$SRC_JS" >/dev/null

          test "$(sha256sum "$SRC_PHP" | awk '{print $1}')" = "$PHP_SHA"
          test "$(sha256sum "$SRC_JS" | awk '{print $1}')" = "$JS_SHA"

          mkdir -p "$BACKUP_ROOT" "$TARGET_DIR/assets"
          cp -p "$TARGET_PHP" "$BACKUP_ROOT/dados-oficiais-br.php"
          if [ -s "$TARGET_JS" ]; then
            cp -p "$TARGET_JS" "$BACKUP_ROOT/seguro-desemprego-calculadora.js"
          fi

          CURRENT_VERSION="$(grep -m1 -E '^[[:space:]]*\* Version:' "$TARGET_PHP" | sed -E 's/.*Version:[[:space:]]*//')"
          echo "CURRENT_VERSION=$CURRENT_VERSION"
          echo "BACKUP=$BACKUP_ROOT"

          cp "$SRC_PHP" "$TMP_PHP"
          cp "$SRC_JS" "$TMP_JS"
          chmod --reference="$TARGET_PHP" "$TMP_PHP" 2>/dev/null || true
          chmod 0644 "$TMP_JS"

          php -l "$TMP_PHP" >/dev/null
          test "$(sha256sum "$TMP_PHP" | awk '{print $1}')" = "$PHP_SHA"
          test "$(sha256sum "$TMP_JS" | awk '{print $1}')" = "$JS_SHA"

          mv -f "$TMP_PHP" "$TARGET_PHP"
          mv -f "$TMP_JS" "$TARGET_JS"
          DEPLOYED=1

          php -l "$TARGET_PHP" >/dev/null
          grep -F "Version: $EXPECTED_VERSION" "$TARGET_PHP" >/dev/null
          grep -F "enqueue_sd_calculator_asset" "$TARGET_PHP" >/dev/null
          grep -F "window.__SANIDA_SD_B14_LOADED__ = true;" "$TARGET_JS" >/dev/null
          test "$(sha256sum "$TARGET_PHP" | awk '{print $1}')" = "$PHP_SHA"
          test "$(sha256sum "$TARGET_JS" | awk '{print $1}')" = "$JS_SHA"

          php -d display_errors=0 -r '
            define("WP_USE_THEMES", false);
            require $argv[1];
            $json = do_shortcode("[sd_parametros_json]");
            $j = json_decode($json, true);
            if (!is_array($j) || ($j["status"] ?? null) !== "current") {
              fwrite(STDERR, "SD_CONTRACT_NOT_CURRENT\n");
              exit(31);
            }
            echo "SD_CONTRACT=PASS\n";
          ' "$WP_ROOT/wp-load.php"

          php -d display_errors=0 -r '
            $php = file_get_contents($argv[1]);
            $js = file_get_contents($argv[2]);
            if (strpos($php, "enqueue_sd_calculator_asset") === false) exit(41);
            if (strpos($php, "assets/seguro-desemprego-calculadora.js") === false) exit(42);
            if (strpos($js, "window.__SANIDA_SD_B14_LOADED__ = true;") === false) exit(43);
            echo "SD_FRONTEND_ASSET=PASS\n";
          ' "$TARGET_PHP" "$TARGET_JS"

          echo "DEPLOYED_VERSION=$EXPECTED_VERSION"
          echo "PHP_SHA256=$PHP_SHA"
          echo "JS_SHA256=$JS_SHA"
          echo "DEPLOY_COMMIT=$COMMIT"
          echo "DOBR_DEPLOY=PASS"

          DEPLOYED=0
          trap - ERR
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
