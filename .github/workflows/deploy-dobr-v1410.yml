name: Deploy DOBR v1.4.10

on:
  push:
    branches:
      - deploy/dobr-v1.4.10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dobr-v1.4.10
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_PORT: "2222"
      WP_ROOT: /home1/sanid210/public_html/blog
      TARGET_FILE: /home1/sanid210/public_html/blog/wp-content/plugins/dados-oficiais-br/dados-oficiais-br.php
      SOURCE_FILE: integrations/wordpress/dados-oficiais-br/dados-oficiais-br.php
      EXPECTED_VERSION: "1.4.10"

    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v5

      - name: Validate source plugin
        shell: bash
        run: |
          set -euo pipefail
          php -l "$SOURCE_FILE"
          grep -F "Version: $EXPECTED_VERSION" "$SOURCE_FILE"
          if grep -Eq '2222\.17|3703\.99|1777\.74|2518\.65' "$SOURCE_FILE"; then
            echo "Annual seguro-desemprego values must not be hardcoded."
            exit 20
          fi
          sha256sum "$SOURCE_FILE"

      - name: Verify HostGator credential contract
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for item in HOST USER SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!item:-}" ]; then
              echo "HOSTGATOR_CREDENTIAL_MISSING=$item"
              exit 21
            fi
          done
          echo "HOSTGATOR_CREDENTIALS=PRESENT"

      - name: Configure pinned SSH client
        shell: bash
        env:
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          test -s "$HOME/.ssh/known_hosts"

      - name: Upload candidate
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          SCP_OPTS=(
            -P "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )
          RUNTIME="/home1/sanid210/dobr-deploy/$GITHUB_SHA"
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p '$RUNTIME'"
          scp "${SCP_OPTS[@]}" "$SOURCE_FILE" "$USER@$HOST:$RUNTIME/dados-oficiais-br.php"

      - name: Deploy atomically and validate live shortcode
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          EXPECTED_SHA="$(sha256sum "$SOURCE_FILE" | awk '{print $1}')"
          RUNTIME="/home1/sanid210/dobr-deploy/$GITHUB_SHA"

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s -- \
            "$RUNTIME/dados-oficiais-br.php" \
            "$TARGET_FILE" \
            "$WP_ROOT" \
            "$EXPECTED_VERSION" \
            "$EXPECTED_SHA" \
            "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail

          SOURCE="$1"
          TARGET="$2"
          WP_ROOT="$3"
          EXPECTED_VERSION="$4"
          EXPECTED_SHA="$5"
          COMMIT="$6"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_ROOT="/home1/sanid210/backups/dados-oficiais-br-$EXPECTED_VERSION-$TS"
          BACKUP="$BACKUP_ROOT/dados-oficiais-br.php"
          TMP_TARGET="${TARGET}.incoming-${COMMIT}"
          JSON1="/tmp/dobr-sd-${COMMIT}-1.json"
          JSON2="/tmp/dobr-sd-${COMMIT}-2.json"
          DEPLOYED=0

          rollback() {
            code=$?
            if [ "$DEPLOYED" -eq 1 ] && [ -s "$BACKUP" ]; then
              echo "ROLLBACK_START=$BACKUP"
              cp -p "$BACKUP" "$TMP_TARGET.rollback"
              mv -f "$TMP_TARGET.rollback" "$TARGET"
              php -l "$TARGET" >/dev/null
              echo "ROLLBACK=PASS"
            fi
            rm -f "$TMP_TARGET" "$JSON1" "$JSON2"
            exit "$code"
          }
          trap rollback ERR

          test -s "$SOURCE"
          test -s "$TARGET"
          test -s "$WP_ROOT/wp-load.php"

          php -l "$SOURCE" >/dev/null
          grep -F "Version: $EXPECTED_VERSION" "$SOURCE" >/dev/null
          ACTUAL_SHA="$(sha256sum "$SOURCE" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          mkdir -p "$BACKUP_ROOT"
          cp -p "$TARGET" "$BACKUP"
          test -s "$BACKUP"

          CURRENT_VERSION="$(grep -m1 -E '^[[:space:]]*\* Version:' "$TARGET" | sed -E 's/.*Version:[[:space:]]*//')"
          echo "CURRENT_VERSION=$CURRENT_VERSION"
          echo "BACKUP=$BACKUP"

          cp "$SOURCE" "$TMP_TARGET"
          chmod --reference="$TARGET" "$TMP_TARGET" 2>/dev/null || true
          php -l "$TMP_TARGET" >/dev/null
          test "$(sha256sum "$TMP_TARGET" | awk '{print $1}')" = "$EXPECTED_SHA"

          mv -f "$TMP_TARGET" "$TARGET"
          DEPLOYED=1

          php -l "$TARGET" >/dev/null
          grep -F "Version: $EXPECTED_VERSION" "$TARGET" >/dev/null
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECTED_SHA"

          php -d display_errors=0 -r '
            define("WP_USE_THEMES", false);
            require $argv[1];
            delete_transient("dobr_sd_params_payload");
            echo "CACHE_CLEARED\n";
          ' "$WP_ROOT/wp-load.php"

          php -d display_errors=0 -r '
            define("WP_USE_THEMES", false);
            require $argv[1];
            echo do_shortcode("[sd_parametros_json]");
          ' "$WP_ROOT/wp-load.php" > "$JSON1"

          php -r '
            $j = json_decode(file_get_contents($argv[1]), true);
            if (!is_array($j)) { fwrite(STDERR, "INVALID_JSON\n"); exit(31); }
            if (($j["status"] ?? null) !== "current") { fwrite(STDERR, "STATUS_NOT_CURRENT:" . json_encode($j) . "\n"); exit(32); }
            $year = $j["reference_year"] ?? null;
            if (!is_int($year) || $year < 2020 || $year > ((int)date("Y") + 1)) exit(33);
            $date = $j["effective_from"] ?? "";
            if (!preg_match("/^\d{4}-\d{2}-\d{2}$/", $date) || strtotime($date) === false || strtotime($date) > time()) exit(34);
            foreach (["floor","first_band_limit","first_band_rate","second_band_limit","second_band_excess_rate","second_band_base","cap"] as $k) {
              if (!isset($j[$k]) || !is_numeric($j[$k]) || (float)$j[$k] <= 0) { fwrite(STDERR, "BAD_FIELD:$k\n"); exit(35); }
            }
            if ((float)$j["first_band_limit"] >= (float)$j["second_band_limit"]) exit(36);
            if ((float)$j["floor"] > (float)$j["cap"]) exit(37);
            if ((float)$j["first_band_rate"] >= 1 || (float)$j["second_band_excess_rate"] >= 1) exit(38);
            $base = round((float)$j["first_band_limit"] * (float)$j["first_band_rate"], 2, PHP_ROUND_HALF_UP);
            if (abs($base - (float)$j["second_band_base"]) > 0.011) exit(39);
            $host = strtolower((string)parse_url((string)($j["source_url"] ?? ""), PHP_URL_HOST));
            if (!in_array($host, ["www.gov.br","gov.br","portalfat.mte.gov.br","portalfat.trabalho.gov.br"], true)) exit(40);
            echo "SD_CONTRACT=PASS\n";
            echo "REFERENCE_YEAR=" . $year . "\n";
            echo "EFFECTIVE_FROM=" . $date . "\n";
            echo "SOURCE_HOST=" . $host . "\n";
          ' "$JSON1"

          php -d display_errors=0 -r '
            define("WP_USE_THEMES", false);
            require $argv[1];
            echo do_shortcode("[sd_parametros_json]");
          ' "$WP_ROOT/wp-load.php" > "$JSON2"

          cmp -s "$JSON1" "$JSON2"
          echo "SD_CACHE_STABILITY=PASS"

          CRON_TS="$(php -d display_errors=0 -r '
            define("WP_USE_THEMES", false);
            require $argv[1];
            $ts = wp_next_scheduled("dobr_cron_refresh_sd_params");
            echo $ts ? (string)$ts : "";
          ' "$WP_ROOT/wp-load.php")"
          test -n "$CRON_TS"
          echo "SD_CRON_SCHEDULED=$CRON_TS"

          echo "DEPLOYED_VERSION=$EXPECTED_VERSION"
          echo "DEPLOYED_SHA256=$EXPECTED_SHA"
          echo "DEPLOY_COMMIT=$COMMIT"
          echo "DOBR_DEPLOY=PASS"

          DEPLOYED=0
          rm -f "$JSON1" "$JSON2"
          trap - ERR
          REMOTE

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
