name: Diagnostic - eSocial HTTPX TLS 1.2 versus 1.3

on:
  push:
    branches: [diagnostics/esocial-two-network-20261125]
    paths: [.github/workflows/diagnose-esocial-httpx-tls-variants.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install production HTTPX
        run: python -m pip install -r requirements-sources.txt
      - name: Exercise identical official URL and SNI with isolated TLS contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, socket, ssl, httpx, time
          from pathlib import Path
          from urllib.parse import urlsplit

          sources=json.loads(Path("docs/source-registry-v1.json").read_text("utf-8"))["sources"]
          url=next(s["url"] for s in sources if s["source_id"]=="ESOCIAL_TABLES_S13_NT07_2026")
          host=urlsplit(url).hostname
          assert host=="www.gov.br"
          ips=sorted({item[4][0] for item in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM) if item[0]==socket.AF_INET})
          print("SOURCE_ID=ESOCIAL_TABLES_S13_NT07_2026",flush=True)
          print("HOST="+host,flush=True)
          print("IPV4_CANDIDATES="+",".join(ips),flush=True)
          print("HTTPX_VERSION="+httpx.__version__,flush=True)
          print("OPENSSL_VERSION="+ssl.OPENSSL_VERSION,flush=True)
          print("TRANSPORT=HTTPX, trust_env=False, HTTP/1.1, verified hostname",flush=True)
          def probe(name, version):
              ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              ctx.minimum_version=version
              ctx.maximum_version=version
              ctx.load_default_certs()
              started=time.monotonic()
              try:
                  with httpx.Client(
                      verify=ctx,trust_env=False,http2=False,
                      follow_redirects=False,timeout=12.0
                  ) as client:
                      response=client.get(url, headers={
                          "User-Agent":"Sanida-Esocial-Transport-Diagnosis/1.0",
                          "Accept":"text/html",
                      })
                      result={"variant":name,"ok":True,"http_status":response.status_code,
                              "body_bytes":len(response.content),
                              "duration_seconds":round(time.monotonic()-started,2)}
              except Exception as exc:
                  errors=[]
                  current=exc
                  seen=set()
                  while current is not None and id(current) not in seen and len(errors)<6:
                      seen.add(id(current))
                      errors.append({"type":type(current).__name__,"text":str(current)[:180],
                                     "errno":getattr(current,"errno",None)})
                      current=current.__cause__ or current.__context__
                  result={"variant":name,"ok":False,"errors":errors,
                          "duration_seconds":round(time.monotonic()-started,2)}
              print("PROBE="+json.dumps(result,sort_keys=True,ensure_ascii=False),flush=True)
          for name, version in (
              ("tls13_a",ssl.TLSVersion.TLSv1_3),
              ("tls12_a",ssl.TLSVersion.TLSv1_2),
              ("tls13_b",ssl.TLSVersion.TLSv1_3),
              ("tls12_b",ssl.TLSVersion.TLSv1_2),
          ):
              probe(name,version)
          print("DIAGNOSTIC_COMPLETE=TRUE",flush=True)
          PY
