name: H25 V2 External Delivery Validation

# WORKFLOW OPERACIONAL TEMPORÁRIO — somente C7.5 read-only na entrega pública.
# A única escrita permitida é a promoção do journal de evidência fora de public_html.

on:
  push:
    branches:
      - deploy/h25-v2-production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h25-v2-external-delivery-validation
  cancel-in-progress: false

jobs:
  external-validation:
    runs-on: ubuntu-latest
    env:
      AUTHORIZED_SOURCE_COMMIT: 505144918d05fb4932064f6f9da9b9358c448ac0
      AUTHORIZATION_ID: c74-v2-h25-production-20260917-505144
      EXPECTED_RELEASE_ID: fiscal-v1-sha256-a741aa7873950d029a5c6b1c929727267125424013f09c69137b7e80b294153e
      EXPECTED_BUNDLE_SHA256: 4ca95de84822fc3bc70ee59c86e73e540e38bec9e6ce5951266ce62a7f8e6627
      EXPECTED_PREFLIGHT_SHA256: 2fc6f01a6f68d3402ea7476cc12d6925ea4daca852e8eef917e3e179f8016e8f
      EXPECTED_CACHE_KEY: 20260916-f06f10
      SSH_PORT: "2222"
      REPO_URL: https://github.com/Rafael-Tinelli/sanida-dados-fiscais.git

    steps:
      - name: Checkout operational head
        uses: actions/checkout@v5

      - name: Compare public JavaScript bytes to authorized commit
        shell: pwsh
        run: |
          ./scripts/run_phase7_c75_external_delivery_probe.ps1 `
            -OutputPath /tmp/h25-v2-c75-external-delivery.json `
            -AuthorizedCommit $env:AUTHORIZED_SOURCE_COMMIT

      - name: Validate public pages, script order, cache key and fiscal endpoints
        shell: python
        run: |
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          BASE = "https://sanida.com.br"
          RELEASE = os.environ["EXPECTED_RELEASE_ID"]
          CACHE = os.environ["EXPECTED_CACHE_KEY"]
          UA = "Sanida-C7.5-External-Public-Validation/2.0"

          def get(path):
              req = Request(BASE + path, headers={"User-Agent": UA, "Cache-Control": "no-cache", "Pragma": "no-cache"})
              try:
                  with urlopen(req, timeout=30) as r:
                      return int(r.status), r.read(), {k.lower(): v for k, v in r.headers.items()}
              except HTTPError as exc:
                  return int(exc.code), exc.read(), {k.lower(): v for k, v in exc.headers.items()}
              except URLError as exc:
                  raise RuntimeError(f"external request failed for {path}: {exc}") from exc

          pages = {
              "H25": ("/financas/calculadoras/", []),
              "H26": ("/financas/calculadoras/salario-liquido-clt/", ["folha-core.js", "salario-liquido.js"]),
              "H27": ("/financas/calculadoras/decimo-terceiro/", ["folha-core.js", "folha-thirteenth.js", "decimo-terceiro.js"]),
              "H28": ("/financas/calculadoras/ferias-clt/", ["folha-core.js", "folha-vacation.js", "ferias-clt.js"]),
              "H29": ("/financas/calculadoras/rescisao-clt/", ["folha-core.js", "folha-termination.js", "rescisao-clt.js"]),
          }
          result = {"observed_at_utc": datetime.now(timezone.utc).isoformat(), "pages": {}, "fiscal": {}, "block_reasons": []}

          for name, (path, scripts) in pages.items():
              status, body, headers = get(path)
              text = body.decode("utf-8", errors="replace")
              blocks = []
              if status != 200:
                  blocks.append(f"http:{status}")
              if "Fatal error" in text or "Parse error" in text:
                  blocks.append("php_error")
              positions = [text.find(script) for script in scripts]
              if scripts and (any(pos < 0 for pos in positions) or positions != sorted(positions) or len(set(positions)) != len(positions)):
                  blocks.append("script_order")
              if CACHE not in text:
                  blocks.append("cache_key_missing")
              if name == "H26" and text.count(CACHE) != 2:
                  blocks.append(f"h26_cache_key_count:{text.count(CACHE)}")
              if name == "H25":
                  required = [
                      "/financas/calculadoras/salario-liquido-clt/",
                      "/financas/calculadoras/decimo-terceiro/",
                      "/financas/calculadoras/ferias-clt/",
                      "/financas/calculadoras/rescisao-clt/",
                  ]
                  if any(link not in text for link in required):
                      blocks.append("required_links")
                  if "Não calcula FGTS" not in text or "aviso prévio" not in text:
                      blocks.append("rescisao_boundary_copy")
              result["pages"][name] = {
                  "path": path,
                  "http_status": status,
                  "bytes": len(body),
                  "script_order": scripts,
                  "script_positions": positions,
                  "cache_key_occurrences": text.count(CACHE),
                  "block_reasons": blocks,
              }
              result["block_reasons"].extend(f"{name}:{block}" for block in blocks)

          status, body, headers = get("/blog/wp-json/sfa/v1/fiscal-health")
          health = json.loads(body.decode("utf-8")) if status == 200 else {}
          health_ok = status == 200 and health.get("status") == "healthy" and health.get("release_id") == RELEASE
          result["fiscal"]["health"] = {"http_status": status, "status": health.get("status"), "release_id": health.get("release_id"), "pass": health_ok}
          if not health_ok:
              result["block_reasons"].append("fiscal_health")

          status, body, headers = get("/blog/wp-json/sfa/v1/fiscal-release")
          release = json.loads(body.decode("utf-8")) if status == 200 else {}
          release_ok = status == 200 and release.get("release_id") == RELEASE
          result["fiscal"]["release"] = {"http_status": status, "release_id": release.get("release_id"), "pass": release_ok}
          if not release_ok:
              result["block_reasons"].append("fiscal_release")

          status, body, headers = get("/blog/wp-json/sfa/v1/folha")
          legacy_ok = status == 410
          result["fiscal"]["legacy_folha"] = {"http_status": status, "pass": legacy_ok}
          if not legacy_ok:
              result["block_reasons"].append("legacy_folha")

          result["status"] = "PASS" if not result["block_reasons"] else "BLOCKED"
          Path("/tmp/h25-v2-c75-public-health.json").write_text(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          if result["status"] != "PASS":
              raise SystemExit(3)

      - name: Verify HostGator credential contract for journal finalization
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for item in HOST USER SSH_KEY KNOWN_HOSTS; do
            test -n "${!item:-}"
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "C75_SSH_RUNTIME_CONFIG=PASS"

      - name: Promote evidence journal to externally healthy
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          EVIDENCE_SHA="$(sha256sum /tmp/h25-v2-c75-external-delivery.json | awk '{print $1}')"
          EVIDENCE_B64="$(base64 -w0 /tmp/h25-v2-c75-external-delivery.json)"
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s -- \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$REPO_URL" \
            "$AUTHORIZATION_ID" "$AUTHORIZED_SOURCE_COMMIT" "$EXPECTED_BUNDLE_SHA256" \
            "$EXPECTED_PREFLIGHT_SHA256" "$EVIDENCE_SHA" "$EVIDENCE_B64" <<'REMOTE' | tee /tmp/h25-v2-c75-finalize-remote.log
          set -euo pipefail
          RUNNER_COMMIT="$1"
          RUN_ID="$2"
          RUN_ATTEMPT="$3"
          REPO_URL="$4"
          AUTHORIZATION_ID="$5"
          AUTHORIZED_SOURCE_COMMIT="$6"
          EXPECTED_BUNDLE_SHA256="$7"
          EXPECTED_PREFLIGHT_SHA256="$8"
          EXPECTED_EVIDENCE_SHA="$9"
          EVIDENCE_B64="${10}"

          RUNTIME="$HOME/h25-v2-c75-runs/${RUN_ID}-${RUN_ATTEMPT}"
          REPO="$RUNTIME/repo"
          JOURNAL="$HOME/h25-v2-deployment-journals/$AUTHORIZATION_ID"
          STATE="$JOURNAL/deployment-state.json"
          EVIDENCE="$JOURNAL/c75-external-evidence.json"

          test ! -e "$RUNTIME"
          mkdir -p "$RUNTIME"
          git clone --quiet "$REPO_URL" "$REPO"
          cd "$REPO"
          git checkout --quiet --detach "$RUNNER_COMMIT"
          test "$(git rev-parse HEAD)" = "$RUNNER_COMMIT"
          test -f "$STATE"

          python3 - "$STATE" "$AUTHORIZATION_ID" "$AUTHORIZED_SOURCE_COMMIT" "$EXPECTED_BUNDLE_SHA256" "$EXPECTED_PREFLIGHT_SHA256" <<'PY'
          import json, sys
          from pathlib import Path
          p, auth, commit, bundle, preflight = sys.argv[1:]
          d = json.loads(Path(p).read_text(encoding='utf-8'))
          assert d.get('authorization_id') == auth
          assert d.get('authorized_commit') == commit
          assert d.get('bundle_manifest_sha256') == bundle
          assert d.get('c73_evidence_sha256') == preflight
          assert d.get('status') == 'APPLIED_ORIGIN_HEALTHY_PENDING_EXTERNAL'
          assert d.get('production_deployed') is True
          assert d.get('origin_health_verified') is True
          assert d.get('external_delivery_verified') is False
          print('REMOTE_PENDING_STATE_GATE=PASS')
          PY

          printf '%s' "$EVIDENCE_B64" | base64 --decode > "$RUNTIME/c75-external-evidence.json"
          test "$(sha256sum "$RUNTIME/c75-external-evidence.json" | awk '{print $1}')" = "$EXPECTED_EVIDENCE_SHA"
          cp "$RUNTIME/c75-external-evidence.json" "$EVIDENCE.tmp"
          mv "$EVIDENCE.tmp" "$EVIDENCE"

          PY="$(command -v python3.9 || command -v python3)"
          export PYTHONPATH="$REPO"
          "$PY" scripts/finalize_phase7_c75_external_health_v2.py \
            --deployment-state "$STATE" \
            --external-evidence "$EVIDENCE" \
            > "$RUNTIME/finalize-output.json"
          cat "$RUNTIME/finalize-output.json"
          echo "__SANIDA_FINAL_STATE_BEGIN__"
          base64 "$STATE" | tr -d '\n'
          echo
          echo "__SANIDA_FINAL_STATE_END__"
          echo "FINAL_STATE_SHA256=$(sha256sum "$STATE" | awk '{print $1}')"
          echo "EXTERNAL_EVIDENCE_SHA256=$(sha256sum "$EVIDENCE" | awk '{print $1}')"
          echo "C75_JOURNAL_FINALIZATION=PASS"
          REMOTE

          awk '/__SANIDA_FINAL_STATE_BEGIN__/{flag=1;next}/__SANIDA_FINAL_STATE_END__/{flag=0}flag' /tmp/h25-v2-c75-finalize-remote.log \
            | tr -d '\n' | base64 --decode > /tmp/h25-v2-final-deployment-state.json
          test -s /tmp/h25-v2-final-deployment-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/h25-v2-final-deployment-state.json').read_text(encoding='utf-8'))
          assert d.get('status') == 'APPLIED_EXTERNALLY_HEALTHY'
          assert d.get('production_deployed') is True
          assert d.get('origin_health_verified') is True
          assert d.get('external_delivery_verified') is True
          assert d.get('final_health_status') == 'HEALTHY'
          ext = d.get('external_delivery') or {}
          assert ext.get('status') == 'PASS'
          assert ext.get('authorized_commit') == '505144918d05fb4932064f6f9da9b9358c448ac0'
          assert ext.get('assets_expected') == 8
          assert ext.get('assets_matching') == 8
          assert d.get('rollback_performed') is False
          print('C75_FINAL_STATE_LOCAL_GATE=PASS')
          PY

      - name: Upload C7.5 external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h25-v2-c75-external-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/h25-v2-c75-external-delivery.json
            /tmp/h25-v2-c75-public-health.json
            /tmp/h25-v2-c75-finalize-remote.log
            /tmp/h25-v2-final-deployment-state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
