name: H25 V2 External Delivery Validation

# WORKFLOW OPERACIONAL TEMPORÁRIO — C7.5.
# O GitHub-hosted runner é bloqueado pela política geográfica do Cloudflare (HTTP 403),
# portanto ele NÃO tenta se passar por um cliente público brasileiro.
# A prova pública é coletada pelo operador externo com o probe canônico; este workflow
# valida essa evidência e apenas promove o journal fora de public_html.

on:
  push:
    branches:
      - deploy/h25-v2-production
    paths:
      - docs/phase7-v2-c75-external-evidence-505144918d05fb4932064f6f9da9b9358c448ac0.json

permissions:
  contents: read

concurrency:
  group: h25-v2-external-delivery-validation
  cancel-in-progress: false

jobs:
  external-validation:
    runs-on: ubuntu-latest
    env:
      AUTHORIZED_SOURCE_COMMIT: 505144918d05fb4932064f6f9da9b9358c448ac0
      AUTHORIZATION_ID: c74-v2-h25-production-20260917-505144
      EXPECTED_RELEASE_ID: fiscal-v1-sha256-a741aa7873950d029a5c6b1c929727267125424013f09c69137b7e80b294153e
      EXPECTED_BUNDLE_SHA256: 4ca95de84822fc3bc70ee59c86e73e540e38bec9e6ce5951266ce62a7f8e6627
      EXPECTED_PREFLIGHT_SHA256: 2fc6f01a6f68d3402ea7476cc12d6925ea4daca852e8eef917e3e179f8016e8f
      EXPECTED_CACHE_KEY: 20260916-f06f10
      EVIDENCE_PATH: docs/phase7-v2-c75-external-evidence-505144918d05fb4932064f6f9da9b9358c448ac0.json
      SSH_PORT: "2222"
      REPO_URL: https://github.com/Rafael-Tinelli/sanida-dados-fiscais.git

    steps:
      - name: Checkout operational head
        uses: actions/checkout@v5

      - name: Validate operator-collected public delivery evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_PATH"
          python3 scripts/validate_phase7_c75_external_evidence_v2.py \
            --evidence "$EVIDENCE_PATH" \
            --authorized-commit "$AUTHORIZED_SOURCE_COMMIT" \
            --release-id "$EXPECTED_RELEASE_ID" \
            --cache-key "$EXPECTED_CACHE_KEY"
          cp "$EVIDENCE_PATH" /tmp/h25-v2-c75-external-delivery.json
          echo "C75_OPERATOR_EVIDENCE_LOCAL_GATE=PASS"

      - name: Verify HostGator credential contract for journal finalization
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
          SSH_KEY: ${{ secrets.V2_HOSTGATOR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.V2_HOSTGATOR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for item in HOST USER SSH_KEY KNOWN_HOSTS; do
            test -n "${!item:-}"
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          echo "C75_SSH_RUNTIME_CONFIG=PASS"

      - name: Promote evidence journal to externally healthy
        shell: bash
        env:
          HOST: ${{ secrets.V2_HOSTGATOR_HOST }}
          USER: ${{ secrets.V2_HOSTGATOR_USER }}
        run: |
          set -euo pipefail
          EVIDENCE_SHA="$(sha256sum "$EVIDENCE_PATH" | awk '{print $1}')"
          EVIDENCE_B64="$(base64 -w0 "$EVIDENCE_PATH")"
          SSH_OPTS=(
            -p "$SSH_PORT"
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o StrictHostKeyChecking=yes
            -o UpdateHostKeys=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=6
          )

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" bash -s -- \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$REPO_URL" \
            "$AUTHORIZATION_ID" "$AUTHORIZED_SOURCE_COMMIT" "$EXPECTED_BUNDLE_SHA256" \
            "$EXPECTED_PREFLIGHT_SHA256" "$EVIDENCE_SHA" "$EVIDENCE_B64" <<'REMOTE' | tee /tmp/h25-v2-c75-finalize-remote.log
          set -euo pipefail
          RUNNER_COMMIT="$1"
          RUN_ID="$2"
          RUN_ATTEMPT="$3"
          REPO_URL="$4"
          AUTHORIZATION_ID="$5"
          AUTHORIZED_SOURCE_COMMIT="$6"
          EXPECTED_BUNDLE_SHA256="$7"
          EXPECTED_PREFLIGHT_SHA256="$8"
          EXPECTED_EVIDENCE_SHA="$9"
          EVIDENCE_B64="${10}"

          RUNTIME="$HOME/h25-v2-c75-runs/${RUN_ID}-${RUN_ATTEMPT}"
          REPO="$RUNTIME/repo"
          JOURNAL="$HOME/h25-v2-deployment-journals/$AUTHORIZATION_ID"
          STATE="$JOURNAL/deployment-state.json"
          EVIDENCE="$JOURNAL/c75-external-evidence.json"

          test ! -e "$RUNTIME"
          mkdir -p "$RUNTIME"
          git clone --quiet "$REPO_URL" "$REPO"
          cd "$REPO"
          git checkout --quiet --detach "$RUNNER_COMMIT"
          test "$(git rev-parse HEAD)" = "$RUNNER_COMMIT"
          test -f "$STATE"

          python3 - "$STATE" "$AUTHORIZATION_ID" "$AUTHORIZED_SOURCE_COMMIT" "$EXPECTED_BUNDLE_SHA256" "$EXPECTED_PREFLIGHT_SHA256" <<'PY'
          import json, sys
          from pathlib import Path
          p, auth, commit, bundle, preflight = sys.argv[1:]
          d = json.loads(Path(p).read_text(encoding='utf-8'))
          assert d.get('authorization_id') == auth
          assert d.get('authorized_commit') == commit
          assert d.get('bundle_manifest_sha256') == bundle
          assert d.get('c73_evidence_sha256') == preflight
          assert d.get('status') == 'APPLIED_ORIGIN_HEALTHY_PENDING_EXTERNAL'
          assert d.get('production_deployed') is True
          assert d.get('origin_health_verified') is True
          assert d.get('external_delivery_verified') is False
          assert d.get('rollback_performed') is False
          print('REMOTE_PENDING_STATE_GATE=PASS')
          PY

          printf '%s' "$EVIDENCE_B64" | base64 --decode > "$RUNTIME/c75-external-evidence.json"
          test "$(sha256sum "$RUNTIME/c75-external-evidence.json" | awk '{print $1}')" = "$EXPECTED_EVIDENCE_SHA"
          "$PYTHON" 2>/dev/null || true
          PY="$(command -v python3.9 || command -v python3)"
          export PYTHONPATH="$REPO"
          "$PY" scripts/validate_phase7_c75_external_evidence_v2.py \
            --evidence "$RUNTIME/c75-external-evidence.json" \
            --authorized-commit "$AUTHORIZED_SOURCE_COMMIT" \
            --release-id 'fiscal-v1-sha256-a741aa7873950d029a5c6b1c929727267125424013f09c69137b7e80b294153e' \
            --cache-key '20260916-f06f10'

          cp "$RUNTIME/c75-external-evidence.json" "$EVIDENCE.tmp"
          mv "$EVIDENCE.tmp" "$EVIDENCE"
          "$PY" scripts/finalize_phase7_c75_external_health_v2.py \
            --deployment-state "$STATE" \
            --external-evidence "$EVIDENCE" \
            > "$RUNTIME/finalize-output.json"
          cat "$RUNTIME/finalize-output.json"
          echo "__SANIDA_FINAL_STATE_BEGIN__"
          base64 "$STATE" | tr -d '\n'
          echo
          echo "__SANIDA_FINAL_STATE_END__"
          echo "FINAL_STATE_SHA256=$(sha256sum "$STATE" | awk '{print $1}')"
          echo "EXTERNAL_EVIDENCE_SHA256=$(sha256sum "$EVIDENCE" | awk '{print $1}')"
          echo "C75_JOURNAL_FINALIZATION=PASS"
          REMOTE

          awk '/__SANIDA_FINAL_STATE_BEGIN__/{flag=1;next}/__SANIDA_FINAL_STATE_END__/{flag=0}flag' /tmp/h25-v2-c75-finalize-remote.log \
            | tr -d '\n' | base64 --decode > /tmp/h25-v2-final-deployment-state.json
          test -s /tmp/h25-v2-final-deployment-state.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/h25-v2-final-deployment-state.json').read_text(encoding='utf-8'))
          assert d.get('status') == 'APPLIED_EXTERNALLY_HEALTHY'
          assert d.get('production_deployed') is True
          assert d.get('origin_health_verified') is True
          assert d.get('external_delivery_verified') is True
          assert d.get('final_health_status') == 'HEALTHY'
          ext = d.get('external_delivery') or {}
          assert ext.get('status') == 'PASS'
          assert ext.get('authorized_commit') == '505144918d05fb4932064f6f9da9b9358c448ac0'
          assert ext.get('assets_expected') == 8
          assert ext.get('assets_matching') == 8
          assert d.get('rollback_performed') is False
          print('C75_FINAL_STATE_LOCAL_GATE=PASS')
          PY

      - name: Upload C7.5 external evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h25-v2-c75-external-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            /tmp/h25-v2-c75-external-delivery.json
            /tmp/h25-v2-c75-finalize-remote.log
            /tmp/h25-v2-final-deployment-state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"
